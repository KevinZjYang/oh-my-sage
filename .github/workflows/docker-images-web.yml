# 构建网页版镜像并推送到 Docker Hub（独立于 MCP，按改动范围触发）
# 触发：main 上 Web 相关文件变化、打 tag v*、或手动触发（workflow_dispatch）
# 前提：仓库 Secrets 里设置 DOCKERHUB_USERNAME 与 DOCKERHUB_TOKEN（用户 Docker Hub 账号 + 访问令牌）
# NAS 更新流程：git pull → bash deploy/run.sh（docker compose pull && up -d）

name: Docker Images (Web)

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'deploy/Dockerfile.web'
      - 'next.config.js'
      - 'src/app/**'
      - 'src/components/**'
      - 'src/server/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

env:
  # 镜像版本号，与 docker-images-mcp.yml、compose 里 image 的 tag 保持一致
  IMAGE_VERSION: 0.1.2

concurrency:
  group: docker-images-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push:
    name: build & push web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.web
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/oh-my-sage-web:${{ env.IMAGE_VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/oh-my-sage-web:latest
